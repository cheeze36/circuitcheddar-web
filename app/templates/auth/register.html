{% extends 'base.html' %}

{% block header %}
<h1>{% block title %}Register{% endblock %}</h1>
{% endblock %}

{% block content %}
<script src="{{ url_for('static', filename='./scripts/register.js') }}"></script>
{% with messages = get_flashed_messages() %}
{% endwith %}

<form method="post">
    <label for="email">Email</label>
    <br>
    <input type="email" name="email" id="email" required placeholder="you@example.com">
    <br>
    <label for="username">username</label>
    <br>
    <input type="text" name="username" id="username" required placeholder="username">
    <br>

    <label for="password">Password</label>
    <br>
    <small>Password must be at least 8 characters and include a number.</small>
    <br>
    <input type="password" name="password" id="password" required>
    <br>
    <label for="confirm">Confirm Password</label>
    <br>
    <input type="password" name="confirm" id="confirm" required>
    <br>
    <label>
        <input type="checkbox" name="terms" required>
        I agree to the <a href="#terms">Terms and Services</a>
    </label>

    <input type="submit" value="Register">
    <p>Already registered? <a href="{{ url_for('app/auth.login') }}">Log in here</a>.</p>
</form>
{% endblock %}
